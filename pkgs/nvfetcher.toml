[gowa]
src.github = "aldinokemal/go-whatsapp-web-multidevice"
fetch.github = "aldinokemal/go-whatsapp-web-multidevice"
fetch.go = "github.com/aldinokemal/go-whatsapp-web-multidevice"

[zai]
src.github = "dotcommander/zai"
fetch.github = "dotcommander/zai"

# lumen — prebuilt release archive, x86_64-darwin only. ai-nixCfg.inputs.lumen
# (jnsahaj/lumen's own flake) instantiates unstable nixpkgs internally, which
# now hard-throws on x86_64-darwin; this sidesteps that by fetching the
# upstream release binary directly instead of building via that flake.
# Run `pkgs-update` to refresh hashes and pick up new releases.
[lumen-x86_64-darwin]
src.github = "jnsahaj/lumen"
fetch.url = "https://github.com/jnsahaj/lumen/releases/download/$ver/lumen-x86_64-apple-darwin.tar.gz"

# Lightpanda — prebuilt nightly binaries, one entry per target platform.
# Run `pkgs-update` to re-hash when the nightly binary changes.
# Version tracks the latest HEAD commit of the upstream repo.
[lightpanda-x86_64-linux]
src.git = "https://github.com/lightpanda-io/browser"
fetch.url = "https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux"

[lightpanda-aarch64-linux]
src.git = "https://github.com/lightpanda-io/browser"
fetch.url = "https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-aarch64-linux"

[lightpanda-x86_64-darwin]
src.git = "https://github.com/lightpanda-io/browser"
fetch.url = "https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-macos"

[lightpanda-aarch64-darwin]
src.git = "https://github.com/lightpanda-io/browser"
fetch.url = "https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-aarch64-macos"

# jcode — prebuilt release archives, one entry per target platform.
# Run `pkgs-update` to track and re-hash the latest GitHub release.
[jcode-x86_64-linux]
src.github = "1jehuang/jcode"
fetch.url = "https://github.com/1jehuang/jcode/releases/download/$ver/jcode-linux-x86_64.tar.gz"

[jcode-aarch64-linux]
src.github = "1jehuang/jcode"
fetch.url = "https://github.com/1jehuang/jcode/releases/download/$ver/jcode-linux-aarch64.tar.gz"

[jcode-x86_64-darwin]
src.github = "1jehuang/jcode"
fetch.url = "https://github.com/1jehuang/jcode/releases/download/$ver/jcode-macos-x86_64.tar.gz"

[jcode-aarch64-darwin]
src.github = "1jehuang/jcode"
fetch.url = "https://github.com/1jehuang/jcode/releases/download/$ver/jcode-macos-aarch64.tar.gz"

# pi-agent-rust — prebuilt release archives. Run `pkgs-update` to refresh
# hashes and pick up new releases. Upstream only publishes aarch64-darwin and
# x86_64-linux; the package below guards the unsupported systems.
[pi-agent-rust-aarch64-darwin]
src.github = "Dicklesworthstone/pi_agent_rust"
fetch.url = "https://github.com/Dicklesworthstone/pi_agent_rust/releases/download/$ver/pi-darwin-arm64.tar.xz"

[pi-agent-rust-x86_64-linux]
src.github = "Dicklesworthstone/pi_agent_rust"
fetch.url = "https://github.com/Dicklesworthstone/pi_agent_rust/releases/download/$ver/pi-linux-amd64.tar.xz"

# CLIProxyAPIPlus — prebuilt release archives per target platform.
# Tracks the CCS fork (kaitranntt/CLIProxyAPIPlus) which mirrors upstream
# router-for-me/CLIProxyAPI daily and adds extra providers (kiro, ghcp,
# cursor, etc.). The `no-plugin` archives contain just the binary.
# Run `pkgs-update` to refresh hashes and pick up new releases.
[cliproxyapi-plus-x86_64-linux]
src.github = "kaitranntt/CLIProxyAPIPlus"
# nvfetcher's fetch.url only does literal "$ver" substitution (no bash
# param-expansion like ${ver#v}), so strip the "v" via src.prefix for the
# asset filename and re-add it by hand for the release-tag path segment.
src.prefix = "v"
fetch.url = "https://github.com/kaitranntt/CLIProxyAPIPlus/releases/download/v$ver/CLIProxyAPIPlus_$ver_linux_amd64_no-plugin.tar.gz"

[cliproxyapi-plus-aarch64-linux]
src.github = "kaitranntt/CLIProxyAPIPlus"
src.prefix = "v"
fetch.url = "https://github.com/kaitranntt/CLIProxyAPIPlus/releases/download/v$ver/CLIProxyAPIPlus_$ver_linux_aarch64_no-plugin.tar.gz"

[cliproxyapi-plus-x86_64-darwin]
src.github = "kaitranntt/CLIProxyAPIPlus"
src.prefix = "v"
fetch.url = "https://github.com/kaitranntt/CLIProxyAPIPlus/releases/download/v$ver/CLIProxyAPIPlus_$ver_darwin_amd64_no-plugin.tar.gz"

[cliproxyapi-plus-aarch64-darwin]
src.github = "kaitranntt/CLIProxyAPIPlus"
src.prefix = "v"
fetch.url = "https://github.com/kaitranntt/CLIProxyAPIPlus/releases/download/v$ver/CLIProxyAPIPlus_$ver_darwin_aarch64_no-plugin.tar.gz"
