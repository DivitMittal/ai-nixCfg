jobs:
  checking-flake:
    permissions:
      contents: write
      id-token: write
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@main
      with:
        fetch-depth: 1
        persist-credentials: false
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@master
    - name: Magic Nix Cache(Use GitHub Actions Cache)
      uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Evaluate the native app and realise its source imports
      run: |-
        system=$(nix eval --impure --raw --expr builtins.currentSystem)
        nix eval --impure --show-trace --raw ".#apps.$system.ai.program"
    - name: Run nix flake check
      run: nix -vL flake check --impure --no-build --show-trace
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-latest
        - ubuntu-24.04-arm
        - macos-latest
        - macos-15-intel
    timeout-minutes: 30
'on':
  pull_request:
    branches:
    - master
    paths:
    - flake.nix
    - flake.lock
    - flake/**
    - pkgs/**
